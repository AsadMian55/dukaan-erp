name: dukaan_erp
description: "DukaanERP - free, offline-first ERP, POS and udhaar khata for small shops. No server, no account, no subscription."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  file_picker: ^8.3.7
  file_saver: ^0.2.14
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
